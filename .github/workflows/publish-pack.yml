name: Validate and publish Nexus Realms

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # STANDARD
      # ============================================================

      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install pinned Packwiz
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/packwiz/packwiz@dfd8b68a4796
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Refresh Packwiz twice and require a clean result
        shell: bash
        run: |
          set -euo pipefail
          packwiz refresh
          packwiz refresh
          git diff --exit-code

      - name: Validate Packwiz index and repository safety
        run: python3 tools/release/pack_release.py --root . validate

      - name: Download pinned Packwiz bootstrap
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_url="$(cat tools/prism/bootstrap.url)"

          curl --fail --location --silent --show-error \
            "$bootstrap_url" \
            --output "$RUNNER_TEMP/packwiz-installer-bootstrap.jar"

          (
            cd "$RUNNER_TEMP"

            sha256sum --check \
              "$GITHUB_WORKSPACE/tools/prism/bootstrap.sha256"
          )

      - name: Build isolated Pages site and distribution archives
        shell: bash
        run: |
          set -euo pipefail

          generated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          python3 tools/release/pack_release.py --root . build \
            --output _site \
            --bootstrap "$RUNNER_TEMP/packwiz-installer-bootstrap.jar" \
            --commit "$GITHUB_SHA" \
            --generated-at "$generated_at"

      # ============================================================
      # LITE
      # ============================================================

      - name: Check out Lite branch
        uses: actions/checkout@v6
        with:
          ref: lite
          path: lite-source
          fetch-depth: 0

      - name: Validate Lite Packwiz
        working-directory: lite-source
        shell: bash
        run: |
          set -euo pipefail

          packwiz refresh
          packwiz refresh
          git diff --exit-code

          python3 tools/release/pack_release.py --root . validate

      - name: Build Lite Packwiz site
        working-directory: lite-source
        shell: bash
        run: |
          set -euo pipefail

          generated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          lite_commit="$(git rev-parse HEAD)"

          python3 tools/release/pack_release.py --root . build \
            --output _site \
            --bootstrap "$RUNNER_TEMP/packwiz-installer-bootstrap.jar" \
            --commit "$lite_commit" \
            --generated-at "$generated_at" \
            --pack-url "https://itscarlosdev.github.io/nexus-realms-pack/lite/pack.toml" \
            --prism-zip-name "NexusRealms-Lite-Prism.zip" \
            --instance-name "Nexus Realms Lite"

      - name: Add Lite distribution to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/lite

          cp -a lite-source/_site/. _site/lite/

          test -f _site/lite/pack.toml
          test -f _site/lite/index.toml
          test -f _site/lite/manifest.json
          test -f _site/lite/downloads/NexusRealms-Lite-Prism.zip

      # ============================================================
      # GITHUB PAGES ENTRY POINT
      # ============================================================

      - name: Create GitHub Pages entry point
        shell: bash
        run: |
          set -euo pipefail

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Nexus Realms</title>
          </head>
          <body>
            <h1>Nexus Realms</h1>

            <p>Distribución oficial del modpack mediante Packwiz.</p>

            <h2>Nexus Realms Standard</h2>

            <ul>
              <li>
                <a href="pack.toml">
                  pack.toml
                </a>
              </li>

              <li>
                <a href="index.toml">
                  index.toml
                </a>
              </li>

              <li>
                <a href="manifest.json">
                  manifest.json
                </a>
              </li>

              <li>
                <a href="downloads/NexusRealms-Prism.zip">
                  Descargar instancia para Prism Launcher
                </a>
              </li>
            </ul>

            <h2>Nexus Realms Lite</h2>

            <ul>
              <li>
                <a href="lite/pack.toml">
                  Lite pack.toml
                </a>
              </li>

              <li>
                <a href="lite/index.toml">
                  Lite index.toml
                </a>
              </li>

              <li>
                <a href="lite/manifest.json">
                  Lite manifest.json
                </a>
              </li>

              <li>
                <a href="lite/downloads/NexusRealms-Lite-Prism.zip">
                  Descargar Nexus Realms Lite para Prism Launcher
                </a>
              </li>
            </ul>
          </body>
          </html>
          HTML

          test -f _site/index.html

          # Standard
          test -f _site/pack.toml
          test -f _site/index.toml
          test -f _site/manifest.json

          # Lite
          test -f _site/lite/pack.toml
          test -f _site/lite/index.toml
          test -f _site/lite/manifest.json
          test -f _site/lite/downloads/NexusRealms-Lite-Prism.zip

      # ============================================================
      # DEPLOY GITHUB PAGES
      # ============================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ================================================================
  # PRODUCTION SMOKE TEST
  # ================================================================

  smoke:
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out smoke-test tool
        uses: actions/checkout@v6

      - name: Wait for GitHub Pages activation
        shell: bash
        run: sleep 30

      - name: Smoke-test the production Standard Packwiz site
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/release/pack_release.py --root . smoke \
            --base-url "${{ needs.deploy.outputs.page_url }}" \
            --attempts 30 \
            --delay 10

      - name: Smoke-test the production Lite Packwiz site
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/release/pack_release.py --root . smoke \
            --base-url "${{ needs.deploy.outputs.page_url }}lite/" \
            --attempts 30 \
            --delay 10