plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = '0.6.24'
group = 'dev.itscarlos'

base {
    archivesName = 'nexus-core'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            mods {
                nexuscore {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            args '--nogui'
            mods {
                nexuscore {
                    source sourceSets.main
                }
            }
        }
    }
}

tasks.withType(net.minecraftforge.gradle.common.util.runs.MinecraftRunTask)
    .matching { it.name == 'runServer' }
    .configureEach {
        // ForgeGradle leaves run-task stdin disconnected; only the local server needs console commands.
        standardInput = System.in
    }

repositories {
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.rtyley'
        }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    // Keep userdev on the same real KubeJS stack as the Packwiz pack. These
    // dependencies are runtime-only: Nexus Core remains reflectively coupled
    // and its production JAR does not bundle KubeJS or its dependencies.
    runtimeOnly fg.deobf('dev.architectury:architectury-forge:9.2.14')
    runtimeOnly fg.deobf('dev.latvian.mods:rhino-forge:2001.2.3-build.10')
    runtimeOnly fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.26')
    compileOnly fg.deobf('curse.maven:curios-309927:6418456')
    compileOnly files('libs/epic-fight-20.14.17-mc1.20.1-forge.jar')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'nexuscore.refmap.json'
    config 'nexuscore.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.20.1',
        forge_version: '47.4.10',
        mod_id: 'nexuscore',
        mod_name: 'Nexus Core',
        mod_license: 'All Rights Reserved',
        mod_version: project.version,
        mod_authors: 'Carlos',
        mod_description: 'Synchronized era progression, UI, and configurable Nexus Market protection.'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }

    from(rootProject.file('../config/nexuscore/eras.json')) {
        into 'assets/nexuscore/progression'
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
    
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    manifest {
        attributes([
            'Specification-Title': 'nexuscore',
            'Specification-Vendor': 'Carlos',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Carlos',
            'MixinConfigs': 'nexuscore.mixins.json'
        ])
    }
}

tasks.register('marketProtectionCheck', JavaExec) {
    group = 'verification'
    description = 'Validates Nexus Market cylindrical region boundary rules.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itscarlos.nexuscore.market.MarketRegionCheck'
}

tasks.register('marketSpawnPolicyCheck', JavaExec) {
    group = 'verification'
    description = 'Validates Nexus Market hostile spawn policy exceptions.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itscarlos.nexuscore.market.MarketSpawnPolicyCheck'
}

tasks.register('keybindProfilePolicyCheck', JavaExec) {
    group = 'verification'
    description = 'Validates neutral keybind migration and class-profile safety.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itscarlos.nexuscore.client.KeybindProfilePolicyCheck'
}

tasks.register('automobilityMarketPolicyCheck', JavaExec) {
    group = 'verification'
    description = 'Validates the exact Automobility attachment footprint policy.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itscarlos.nexuscore.market.AutomobilityMarketPolicyCheck'
}

tasks.register('cameraIntegrationPolicyCheck', JavaExec) {
    group = 'verification'
    description = 'Validates Camera upload bounds and image storage policy.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itscarlos.nexuscore.camera.CameraIntegrationPolicyCheck'
}

tasks.register('shutdownHangDiagnosticCheck', JavaExec) {
    group = 'verification'
    description = 'Validates shutdown watchdog safety and JVM report structure.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itscarlos.nexuscore.diagnostics.ShutdownHangDiagnosticCheck'
}

tasks.register('classChangePolicyCheck', JavaExec) {
    group = 'verification'
    description = 'Validates class-change XP, cooldown, and recovery boundaries.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itscarlos.nexuscore.ClassChangePolicyCheck'
}

tasks.named('check') {
    dependsOn tasks.named('classChangePolicyCheck')
    dependsOn tasks.named('automobilityMarketPolicyCheck')
    dependsOn tasks.named('cameraIntegrationPolicyCheck')
    dependsOn tasks.named('marketProtectionCheck')
    dependsOn tasks.named('marketSpawnPolicyCheck')
    dependsOn tasks.named('keybindProfilePolicyCheck')
    dependsOn tasks.named('shutdownHangDiagnosticCheck')
}
